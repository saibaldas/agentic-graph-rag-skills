# Observability stack A: Arize Phoenix + its OWN Neo4j, for notebooks_advanced_with_observability
# (.env: OBSERVABILITY_BACKEND=phoenix).
#
#   docker compose -f docker-compose/docker-compose.phoenix.yml up -d
#
#   Phoenix UI        http://localhost:6006
#   Neo4j browser     http://localhost:7475      bolt://localhost:7688   (neo4j / password)
#
# Own Neo4j on its own ports + its own ./volumes/phoenix/* folders, so it never clashes with docker-compose.yml
# (7687, ./volumes/justneo4j/...) or docker-compose.deepeval.yml (7689, ./volumes/deepeval/...). The notebooks pick the right bolt
# port from OBSERVABILITY_BACKEND (override with NEO4J_URI in the notebooks' .env).
name: agentic-graph-rag-obs-phoenix

services:
  neo4j:
    image: neo4j:5.26.32-enterprise
    container_name: obs-phoenix-neo4j-agentic-graph-rag-skills
    environment:
      NEO4J_AUTH: 'neo4j/${NEO4J_PASSWORD:-password}'
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 8g
    volumes:
      - ./volumes/phoenix/data:/data:rw
      - ./volumes/phoenix/logs:/logs:rw
      - ./volumes/phoenix/import:/var/lib/neo4j/import:rw
      - ./volumes/phoenix/plugins:/plugins:rw
    ports:
      - 7475:7474   # Neo4j browser
      - 7688:7687   # Bolt (drivers / notebooks)

  phoenix:
    image: arizephoenix/phoenix:version-20.26.0   # pinned (digest sha256:095f4987...); bump deliberately
    container_name: obs-phoenix-ui-agentic-graph-rag-skills
    ports:
      - "6006:6006"   # UI + OTLP/HTTP collector
      - "4317:4317"   # OTLP/gRPC collector (optional)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data   # traces survive container restarts

volumes:
  phoenix_data:
    name: agentic-graph-rag-obs-phoenix-data
